name: flexxsignal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flexxsignal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flexxsignal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/FlexXSignal.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flexxsignal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      Seed__SuperAdminEmail: ${SEED_SUPERADMIN_EMAIL:-admin@flexxsignal.local}
      Seed__PremiumUserEmail: ${SEED_PREMIUM_EMAIL:-demo@flexxsignal.local}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?SEED_SUPERADMIN_PASSWORD must be set in .env}
      SEED_PREMIUM_PASSWORD: ${SEED_PREMIUM_PASSWORD:?SEED_PREMIUM_PASSWORD must be set in .env}
      MarketDataProvider__Endpoint: ${MARKET_DATA_PROVIDER_ENDPOINT:-}
      MarketDataProvider__ApiKey: ${MARKET_DATA_PROVIDER_API_KEY:-}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./flexxsignal-client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - client
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  postgres_data:
  redis_data:
  api_logs:
