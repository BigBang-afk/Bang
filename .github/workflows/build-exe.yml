name: Build Windows EXE

on:
  push:
    branches:
      - claude/trading-portfolio-dashboard-57pjfu
    paths:
      - "src/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish src/TradingPortfolioDashboard/TradingPortfolioDashboard.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TradingPortfolioDashboard-win-x64
          path: publish/TradingPortfolioDashboard.exe
