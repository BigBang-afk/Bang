databases:
  - name: aurum-postgres
    plan: free
    databaseName: crypto_signals
    user: aurum

services:
  - type: redis
    name: aurum-redis
    plan: free
    ipAllowList: []

  - type: web
    name: aurum-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aurum-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aurum-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MEXC_BASE_URL
        value: https://api.mexc.com
      - key: MEXC_FUTURES_BASE_URL
        value: https://contract.mexc.com
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
