<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Bang Jewelry Platform</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body>
    <div class="centered-page">
      <div class="card">
        <div class="brand" style="justify-content: center; margin-bottom: 1.75rem">
          <div class="brand-mark">B</div>
          <div class="brand-title">Bang</div>
        </div>

        <div id="alert" class="alert alert-error"></div>

        <form id="login-form">
          <div id="password-step">
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" autocomplete="current-password" required />
            </div>
          </div>

          <div id="mfa-step" style="display: none">
            <div class="field">
              <label for="totp">Authentication code</label>
              <input
                type="text"
                id="totp"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="6"
                autocomplete="one-time-code"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
        </form>

        <div class="helper-text">
          <a href="/password-reset-request.html">Forgot your password?</a>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('alert');
      const mfaStep = document.getElementById('mfa-step');
      const passwordStep = document.getElementById('password-step');
      const submitBtn = document.getElementById('submit-btn');
      let mfaMode = false;

      function showError(message) {
        alertBox.textContent = message;
        alertBox.classList.add('visible');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.remove('visible');
        submitBtn.disabled = true;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const totp = document.getElementById('totp').value.trim();

        try {
          const result = await login(email, password, mfaMode ? totp : undefined);
          if (result.mfaRequired) {
            mfaMode = true;
            passwordStep.style.display = 'none';
            mfaStep.style.display = 'block';
            submitBtn.textContent = 'Verify code';
            submitBtn.disabled = false;
            return;
          }
          window.location.href = '/dashboard.html';
        } catch (err) {
          showError(err.message);
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
