<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set new password — Bang Jewelry Platform</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body>
    <div class="centered-page">
      <div class="card">
        <div class="brand" style="justify-content: center; margin-bottom: 1rem">
          <div class="brand-mark">B</div>
          <div class="brand-title">Bang</div>
        </div>
        <h1 style="font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem">
          Set a new password
        </h1>

        <div id="alert-error" class="alert alert-error"></div>
        <div id="alert-success" class="alert alert-success"></div>

        <form id="confirm-form">
          <div class="field">
            <label for="token">Reset token</label>
            <input type="text" id="token" required />
          </div>
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="8" required />
          </div>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>

        <div class="helper-text"><a href="/login.html">Back to sign in</a></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const tokenField = document.getElementById('token');
      if (params.get('token')) tokenField.value = params.get('token');

      const form = document.getElementById('confirm-form');
      const errorBox = document.getElementById('alert-error');
      const successBox = document.getElementById('alert-success');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');
        successBox.classList.remove('visible');

        const token = tokenField.value.trim();
        const newPassword = document.getElementById('newPassword').value;

        try {
          const res = await fetch('/api/auth/password-reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Reset failed');

          successBox.textContent = 'Password updated. You can now sign in.';
          successBox.classList.add('visible');
          form.reset();
          setTimeout(() => (window.location.href = '/login.html'), 1500);
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add('visible');
        }
      });
    </script>
  </body>
</html>
