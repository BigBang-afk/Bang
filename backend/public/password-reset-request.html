<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Bang Jewelry Platform</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body>
    <div class="centered-page">
      <div class="card">
        <div class="brand" style="justify-content: center; margin-bottom: 1rem">
          <div class="brand-mark">B</div>
          <div class="brand-title">Bang</div>
        </div>
        <h1 style="font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem">
          Reset your password
        </h1>

        <div id="alert-error" class="alert alert-error"></div>
        <div id="alert-success" class="alert alert-success"></div>

        <form id="request-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" required />
          </div>
          <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>

        <div class="helper-text"><a href="/login.html">Back to sign in</a></div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
      const form = document.getElementById('request-form');
      const errorBox = document.getElementById('alert-error');
      const successBox = document.getElementById('alert-success');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');
        successBox.classList.remove('visible');

        const email = document.getElementById('email').value.trim();
        try {
          const res = await fetch('/api/auth/password-reset/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Request failed');

          let message =
            'If that email is registered, a reset link has been sent. Check your inbox.';
          if (data.devToken) {
            message += ` (dev mode) Reset link: /password-reset-confirm.html?token=${data.devToken}`;
          }
          successBox.textContent = message;
          successBox.classList.add('visible');
          form.reset();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add('visible');
        }
      });
    </script>
  </body>
</html>
