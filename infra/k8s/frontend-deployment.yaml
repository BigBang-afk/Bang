apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bang
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/bigbang-afk/bang-frontend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: BACKEND_URL
              value: http://backend:8000
            - name: NEXT_PUBLIC_WS_URL
              value: wss://app.example.com/ws
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bang
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
