# Copy to secrets.yaml, fill in real values, and apply with `kubectl apply -f`.
# Never commit the filled-in secrets.yaml to git.
apiVersion: v1
kind: Secret
metadata:
  name: bang-secrets
  namespace: bang
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://bang:CHANGE_ME@postgres:5432/bang
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SECRET_KEY: CHANGE_ME
  ENCRYPTION_KEY: CHANGE_ME
  ANTHROPIC_API_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  DISCORD_WEBHOOK_URL: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
